<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14110f">
<title>전광판 · 주점 부스</title>
<script src="__BASE__/static/base.js"></script>
<link rel="stylesheet" href="__BASE__/static/staff.css">
<style>
  html { font-size: min(1.3vw, 2.4vh); }
  body { height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; gap: 1.1rem; padding: 1.1rem 2rem 1.2rem; font-size: 1rem; cursor: none;
    background: radial-gradient(60rem 30rem at 18% -8%, rgba(255, 176, 32, .18), transparent 70%), radial-gradient(50rem 30rem at 100% 110%, rgba(255, 90, 77, .10), transparent 70%), var(--bg); }
  body.mouse { cursor: default; }
  .b-head { display: flex; align-items: center; gap: 1.5rem; }
  .b-title { font-size: 2.1rem; font-weight: 900; letter-spacing: -.01em; margin-right: auto; }
  .b-title span { color: var(--accent); }
  .cta { display: inline-flex; align-items: center; gap: .7rem; padding: .35rem 1.3rem; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 1.7rem; animation: cta 2.4s ease-in-out infinite; }
  @keyframes cta { 50% { transform: scale(1.04); box-shadow: 0 0 0 .5rem rgba(255, 176, 32, .22); } }
  .clock { text-align: right; line-height: 1.1; }
  .clock small { display: block; color: var(--muted); font-size: .8rem; font-weight: 800; }
  .clock b { font-size: 2rem; font-variant-numeric: tabular-nums; }
  .b-main { max-width: none; margin: 0; padding: 0; display: grid; grid-template-columns: .9fr 1.5fr; gap: 1.8rem; min-height: 0; }
  .panel { background: var(--surface); border: .14rem solid var(--line); border-radius: 1.3rem; padding: 1.1rem 1.5rem; display: grid; align-content: start; gap: .8rem; min-height: 0; }
  .p-title { flex-wrap: wrap; font-size: 1.15rem; font-weight: 900; color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .p-title b { color: var(--accent); font-size: 1.1rem; }
  .hero { border-color: var(--accent); box-shadow: 0 0 3rem rgba(255, 176, 32, .14), inset 0 0 0 .1rem rgba(255, 176, 32, .25); }
  .lead { display: flex; align-items: center; gap: 1.4rem; }
  .lead .no { min-width: 6rem; text-align: center; font-size: 7rem; font-weight: 900; line-height: .95; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 0 2rem rgba(255, 176, 32, .45); letter-spacing: -.04em; }
  .lead .who { display: grid; gap: .1rem; min-width: 0; }
  .lead .tb { font-size: 1.8rem; font-weight: 900; }
  .lead .nk { font-size: 2.4rem; font-weight: 900; overflow-wrap: anywhere; line-height: 1.1; }
  .lead .pt { font-size: 1.8rem; font-weight: 800; color: var(--muted); }
  .lead .pt b { color: var(--text); font-size: 2.2rem; font-variant-numeric: tabular-nums; }
  .lead.swap .no, .lead.swap .who { animation: pop .8s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  .prize { padding: .5rem 1rem; border-radius: .8rem; background: rgba(255, 176, 32, .14); border: .1rem solid var(--accent); font-size: 1.3rem; font-weight: 800; }
  .prize b { color: var(--accent); }
  .nobody { font-size: 2rem; font-weight: 900; line-height: 1.3; padding: 1rem 0; }
  .nobody span { color: var(--accent); }
  .rklist { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; position: relative; }
  .rk { display: grid; grid-template-columns: 2.4rem 5.3rem 1fr auto; align-items: center; gap: .7rem; padding: .35rem .8rem; border-radius: .8rem; background: var(--raised); height: 3.1rem; will-change: transform; }
  .rk .pos { font-size: 1.5rem; font-weight: 900; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .rk[data-r="1"] .pos { color: var(--accent); }
  .rk .tb { font-size: 1.6rem; font-weight: 900; white-space: nowrap; }
  .rk .nk { font-size: 1.5rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .rk .sc { font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .rk.enter { animation: enter .6s ease-out; }
  .rk.bump .sc { animation: bump .9s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(-2rem); } }
  @keyframes bump { 30% { color: var(--accent); transform: scale(1.25); } }
  .games { display: grid; gap: 1.4rem; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); min-height: 0; }
  .games .rk { grid-template-columns: 2rem minmax(0, 1fr) auto; height: 4.4rem; }
  .games .rk .who2 { display: grid; line-height: 1.1; min-width: 0; }
  .games .rk .tb { font-size: 1.7rem; }
  .games .rk .nk { max-width: 100%; }
  .games .rk .nk { font-size: 1.15rem; color: var(--muted); }
  .b-foot { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; min-height: 2.6rem; font-weight: 800; font-size: 1.3rem; }
  .stock { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
  .stock .lab { color: var(--muted); }
  .pill { padding: .25rem 1rem; border-radius: 999px; border: .1rem solid var(--line); background: var(--surface); }
  .pill b { color: var(--accent); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .pill.out { border-color: var(--danger); color: var(--danger); }
  .pill.out b { color: var(--danger); }
  .prev { margin-left: auto; color: var(--muted); }
  .prev b { color: var(--text); }
  .b-conn { position: fixed; right: 1rem; bottom: .7rem; font-size: .75rem; opacity: .75; }
  .b-conn[data-s="live"] { display: none; }
  .b-conn[data-s="off"] { opacity: 1; font-size: 1.2rem; }
  .fs { position: fixed; right: 1rem; top: 1rem; z-index: 5; opacity: 0; transition: opacity .3s; }
  body.mouse .fs { opacity: 1; }
  @media (max-aspect-ratio: 1/1) {
    html { font-size: min(2.6vw, 2vh); }
    body { height: auto; min-height: 100vh; overflow: auto; }
    .b-main { grid-template-columns: 1fr; }
    .games { grid-template-columns: 1fr; }
    .b-head { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { .cta, .rk.enter, .rk.bump .sc, .lead.swap .no, .lead.swap .who { animation: none; } }
</style>
</head>
<body>
<header class="b-head">
  <h1 class="b-title" id="title"></h1>
  <div class="cta" aria-label="QR 코드를 찍고 도전하세요">QR 찍고 도전!</div>
  <div class="clock"><small id="clock-l">이번 시간 마감까지</small><b id="clock" class="num">--:--</b></div>
</header>
<main class="b-main">
  <section class="panel hero" aria-labelledby="hero-h">
    <h2 class="p-title" id="hero-h"><span>이번 시간 1등 테이블</span><b id="hour-range"></b></h2>
    <div id="lead"></div>
    <div class="prize" id="prize" hidden></div>
    <ol class="rklist" id="hour-list" aria-label="이번 시간 순위"></ol>
  </section>
  <div class="games" id="games"></div>
</main>
<footer class="b-foot">
  <div class="stock" id="stock" hidden><span class="lab">남은 보상</span></div>
  <div class="prev" id="prev"></div>
</footer>
<div class="conn b-conn" id="conn" data-s="wait"><span class="dot"></span><span id="conn-t">연결 중</span></div>
<button class="btn fs" id="fs" type="button">전체 화면</button>
<script src="__BASE__/static/staff-common.js"></script>
<script src="__BASE__/static/board.js"></script>
</body>
</html>
