<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>QR 인쇄 · 주점 부스</title>
<script src="__BASE__/static/base.js"></script>
<link rel="stylesheet" href="__BASE__/static/staff.css">
<style>
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar h1 { font-size: 1.15rem; font-weight: 900; margin-right: auto; }
  .bar h1 span { color: var(--accent); }
  .info { max-width: 900px; margin: 14px auto 0; padding: 0 16px; display: grid; gap: 10px; }
  .warn { padding: 12px 14px; border: 2px solid var(--accent); border-radius: 12px; background: rgba(255, 176, 32, .1); font-weight: 700; overflow-wrap: anywhere; }
  .err { padding: 24px 16px; text-align: center; display: grid; gap: 14px; justify-items: center; }
  .sheets { padding: 16px 8px 40px; display: grid; gap: 18px; justify-content: center; zoom: var(--z, 1); }
  .sheet { width: 190mm; height: 276mm; background: #fff; color: #000; display: grid; grid-template-columns: 95mm 95mm; grid-template-rows: 138.5mm 138.5mm; box-shadow: 0 6px 30px rgba(0, 0, 0, .5); break-after: page; page-break-after: always; }
  .card { position: relative; width: 95mm; height: 138.5mm; display: flex; flex-direction: column; outline: .25mm dashed #888; outline-offset: -.25mm; break-inside: avoid; page-break-inside: avoid; background: #fff; color: #000; font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .half { height: 69mm; padding: 4mm 5mm 3mm; overflow: hidden; display: grid; grid-template-columns: 1fr 42mm; grid-template-rows: 1fr auto; column-gap: 2mm; align-items: center; }
  .half.flip { transform: rotate(180deg); }
  .id { display: grid; justify-items: center; align-content: center; line-height: 1; }
  .id .l { font-size: 4.6mm; font-weight: 800; letter-spacing: .08em; }
  .id .n { font-weight: 900; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 1mm; }
  .id .n.d1 { font-size: 44mm; } .id .n.d2 { font-size: 30mm; } .id .n.d3 { font-size: 21mm; } .id .n.w { font-size: 17mm; letter-spacing: 0; white-space: nowrap; }
  .qrbox { width: 42mm; height: 42mm; }
  .qrbox svg { width: 100%; height: 100%; display: block; }
  .cap { grid-column: 1 / -1; text-align: center; font-size: 5.8mm; font-weight: 900; padding-top: 1mm; }
  .cap small { display: block; font-size: 3.1mm; font-weight: 700; color: #333; margin-top: .6mm; }
  .fold { position: absolute; left: 0; right: 0; top: 69.25mm; border-top: .25mm dashed #888; text-align: center; height: 0; }
  .fold span { position: relative; top: -1.7mm; background: #fff; padding: 0 2mm; font-size: 2.4mm; color: #666; }
  .url { position: absolute; left: 4px; right: 4px; bottom: 2px; font-size: 9px; color: #666; text-align: center; overflow-wrap: anywhere; }
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    html, body { background: #fff !important; color: #000 !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .noprint { display: none !important; }
    .sheets { padding: 0; gap: 0; zoom: 1; display: block; }
    .sheet { box-shadow: none; margin: 0; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    .url { display: none; }
  }
</style>
</head>
<body>
<div class="bar noprint">
  <h1>QR 인쇄 <span>테이블 텐트</span></h1>
  <a class="btn" href="__BASE__/staff">스태프 화면</a>
  <button class="btn btn-primary" id="print" type="button" disabled>인쇄 (A4 · 4장씩)</button>
</div>
<div class="info noprint" id="info"></div>
<main class="sheets" id="sheets" aria-live="polite"></main>
<script src="__BASE__/static/vendor/qr.js"></script>
<script src="__BASE__/static/staff-common.js"></script>
<script src="__BASE__/static/qr-page.js"></script>
</body>
</html>
