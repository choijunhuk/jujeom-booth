<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>QR 인쇄 · COMHERE</title>
<script src="__BASE__/static/base.js"></script>
<script src="__BASE__/static/notify.js"></script>
<link rel="stylesheet" href="__BASE__/static/brand/brand.css">
<link rel="stylesheet" href="__BASE__/static/staff.css">
<style>
  .info { margin: 0 0 8px; display: grid; gap: 10px; }
  .warn { padding: 12px 14px; border: 2px solid var(--accent); border-radius: 12px; background: rgba(255, 176, 32, .1); font-weight: 700; overflow-wrap: anywhere; }
  .cards { padding: 8px 0 40px; display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; }
  .cell { flex: 0 0 95mm; width: 95mm; display: grid; gap: 8px; align-content: start; }
  .cell.sel .card { box-shadow: 0 0 0 3px var(--accent); }
  .pick { display: flex; gap: 10px; align-items: center; font-weight: 800; min-height: 44px; }
  .pick input { width: 24px; height: 24px; accent-color: #ffb020; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts .btn { flex: 1 1 auto; }
  .urlline { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
  /* Print card: one flat panel (no fold) so it can be laminated, cut on the dashed outline. Black on white "window".
     Bitmap font only at multiples of 16px; QR stays pure black/white with a 4-module quiet zone.
     95 x 138 mm: 4 per A4 inside a 6 mm page margin, and it fits an A6 laminating pouch / A6 acrylic stand. */
  /* staff.css also styles .card (padding 14px, 2px border, radius, 12px gap): reset them, or the card overflows 138mm and the bottom is cut */
  .card { position: relative; width: 95mm; height: 138mm; display: grid; padding: 3mm; border: 0; border-radius: 0; gap: 0; box-sizing: border-box; outline: .25mm dashed #888; outline-offset: -.25mm; break-inside: avoid; page-break-inside: avoid; background: #fff; color: #000; font-family: var(--y-font-ui); }
  .win { border: 2px solid #000; display: grid; grid-template-rows: 24px 30mm 72mm 9mm 6.5mm minmax(0, 1fr); justify-items: center; background: #fff; min-height: 0; }
  .tbar { justify-self: stretch; display: flex; align-items: center; gap: 6px; padding: 0 6px; height: 24px; background: #000; color: #fff; font: 16px/24px var(--y-font-pixel); -webkit-font-smoothing: none; font-synthesis: none; }
  .tbar img { height: 16px; width: auto; filter: invert(1); }
  .tbar .tt { flex: 1; }
  .tbar .tb3 { display: flex; gap: 3px; } .tbar .tb3 i { width: 10px; height: 10px; border: 2px solid #fff; display: block; }
  .id { align-self: center; display: flex; align-items: baseline; justify-content: center; gap: 3mm; line-height: 1; }
  .id .l { font: 800 7mm/1 var(--y-font-ui); letter-spacing: .04em; }
  .id .n { font-family: var(--y-font-num); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .id .n.d1, .id .n.d2 { font-size: 108px; } .id .n.d3 { font-size: 88px; }
  .id .n.w { font-family: var(--y-font-ui); font-weight: 900; font-size: 80px; letter-spacing: 0; }
  .qrbox { width: 72mm; height: 72mm; }
  .qrbox svg { width: 100%; height: 100%; display: block; }
  .cap { align-self: end; font-size: 6mm; font-weight: 900; line-height: 1; }
  .sub { align-self: center; font-size: 4mm; font-weight: 700; line-height: 1; }
  .foot { align-self: center; font: 700 11px/1 var(--y-font-ui); letter-spacing: .12em; }
  @media print {
    @page { size: A4 portrait; margin: 6mm; } /* 2 rows x 138mm = 276mm of 285mm: room for browsers that add their own margins */
    html, body { background: #fff !important; color: #000 !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .noprint, .top, .strip, .dlg, #toasts { display: none !important; }
    main { padding: 0 !important; max-width: none !important; margin: 0 !important; }
    .cards { display: flex; flex-wrap: wrap; gap: 0; padding: 0; width: 190mm; margin: 0; justify-content: flex-start; }
    .cell { break-inside: avoid; page-break-inside: avoid; height: 138mm; }
    .cell .card { box-shadow: none !important; }
    body.print-sel .cell:not(.sel) { display: none !important; }
    body.print-one .cell:not(.one) { display: none !important; }
  }
</style>
</head>
<body>
<noscript><p style="padding:24px">이 페이지는 JavaScript가 필요합니다.</p></noscript>
<div id="login" class="login noprint" hidden></div>
<div id="app" hidden>
  <main id="main">
    <div class="view-head noprint" id="bar"></div>
    <div class="info noprint" id="info"></div>
    <div class="cards" id="cards" aria-live="polite"></div>
  </main>
</div>
<div id="toasts" class="noprint" role="status" aria-live="polite"></div>
<script src="__BASE__/static/vendor/qr.js"></script>
<script src="__BASE__/static/staff-common.js"></script>
<script src="__BASE__/static/alarm.js"></script>
<script src="__BASE__/static/shell.js"></script>
<script src="__BASE__/static/qr-page.js"></script>
</body>
</html>
