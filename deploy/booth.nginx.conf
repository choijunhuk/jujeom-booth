# /etc/nginx/snippets/booth.conf 로 복사하고 coms.conf 의 443 server 블록에서 include 한다.
# 기존 location 은 하나도 고치지 않는다. 되돌릴 때는 include 줄과 이 파일을 지우고 nginx -t && reload.
# /booth 로 시작하는 요청만 가져가므로 기존 `location /` (프론트 컨테이너) 동작은 그대로다.
# 먼저 booth-limits.nginx.conf 를 conf.d 에 넣어야 한다 (아래 limit_* 가 그 zone 을 쓴다).

location = /booth {
    return 301 /booth/;
}

# 입금 알림 웹훅: 주소에 비밀 값이 들어 있으므로 접속 기록을 남기지 않는다.
location ^~ /booth/api/deposit-hook {
    access_log off;
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 15s;
    client_max_body_size 8k;
    limit_conn booth_conn 400;
    limit_req zone=booth_req burst=60 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
}

# ^~ : coms.conf 에 정규식 location (예: 정적 파일 캐시 규칙) 이 있어도 /booth/ 는 항상 여기로 온다
location ^~ /booth/ {
    proxy_pass http://127.0.0.1:4200;   # URI 를 붙이지 않는다: /booth/... 경로가 그대로 전달된다
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 실시간 갱신(SSE): 버퍼링을 끄고, 서버 기본 60초 타임아웃에 끊기지 않게 늘린다.
    # 앱이 20초마다 heartbeat 를 보내므로 5분이면 충분하다.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 5m;

    # 메뉴 사진 업로드가 최대 400KB 다. JSON 요청은 앱이 16KB 로 따로 제한한다.
    client_max_body_size 512k;

    # 부스 접속이 몰려도 nginx 연결과 디스크를 기존 사이트와 나눠 쓰지 않게 상한을 둔다
    limit_conn booth_conn 400;          # 부스 전체 동시 연결
    limit_req zone=booth_req burst=60 nodelay;   # POST 만 센다 (booth-limits.nginx.conf 의 map)
    limit_req_status 429;
    limit_conn_status 429;
}
