# /etc/nginx/conf.d/booth-limits.conf 로 복사한다 (conf.d 는 http 수준에서 include 된다).
# 새 zone 두 개와 map 하나를 선언할 뿐이고, booth.nginx.conf 의 location 에서만 쓴다.
# 기존 사이트의 어떤 location 에도 영향이 없다. 되돌릴 때는 이 파일을 지운다.

# 부스 전체 동시 연결 수 (SSE 스트림이 nginx worker 연결을 다 쓰지 못하게)
limit_conn_zone $server_name zone=booth_conn:1m;

# 속도 제한은 POST (주문, 닉네임, 게임, 대기 등록) 에만 건다.
# 키가 빈 문자열이면 nginx 는 그 요청을 세지 않으므로, 페이지와 정적 파일 GET 은 제한 없이 나간다.
# 학교 망은 여러 사람이 한 주소로 나오므로 주소당 값을 넉넉하게 잡는다 (손님 한 명은 분당 POST 몇 번).
map $request_method $booth_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $booth_post_key zone=booth_req:5m rate=30r/s;
